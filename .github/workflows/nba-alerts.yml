name: NBA halftime alerts

on:
  schedule:
    # Times are UTC. Only two runs a day, timed around games:
    #  16:40 UTC (12:40pm EDT / 11:40am EST): weekend/holiday afternoon games; exits in
    #    seconds on days with nothing in the afternoon.
    #  23:15 UTC (7:15pm EDT / 6:15pm EST): the evening slate. Runs ~5h45m, so it covers
    #    the latest West Coast halftimes (10:30pm ET tips) in both EDT and EST.
    - cron: "40 16 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch:      # "Run workflow" button for starting it manually from your phone
    inputs:
      mode:
        description: "watch = run the alert bot, test = send a sample alert to your phone"
        type: choice
        options: [watch, test]
        default: watch

concurrency:
  group: nba-alerts       # never run two watchers at once
  cancel-in-progress: false

permissions:
  contents: write         # lets the job save data/alerts.csv back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch live games
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DEFICIT: "10"
          RUN_MINUTES: "345"
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            python nba_halftime_alerts.py --test
            python - <<'PY'
          import os, urllib.request, json
          k = os.environ.get("ODDS_API_KEY", "")
          if not k:
              print("ODDS_API_KEY secret is missing")
          else:
              with urllib.request.urlopen(f"https://api.the-odds-api.com/v4/sports?apiKey={k}") as r:
                  print("Odds API key OK - credits remaining:", r.headers.get("x-requests-remaining"))
          PY
          else
            python nba_halftime_alerts.py
          fi

      - name: Save alert log
        if: always()
        run: |
          python nba_halftime_alerts.py --report || true
          git config user.name "nba-alert-bot"
          git config user.email "nba-alert-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "Alert log $(date -u +%F)" && git pull --rebase && git push)
