name: NBA halftime alerts

on:
  schedule:
    # Times are UTC. 16:40 catches weekend/holiday afternoon slates (exits right away on
    # normal weekdays); 22:40 covers the evening slate through the last West Coast halftime.
    - cron: "40 16 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch: {}   # "Run workflow" button for starting it manually from your phone

concurrency:
  group: nba-alerts       # never run two watchers at once
  cancel-in-progress: false

permissions:
  contents: write         # lets the job save data/alerts.csv back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch live games
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DEFICIT: "10"
          RUN_MINUTES: "345"
        run: python nba_halftime_alerts.py

      - name: Save alert log
        if: always()
        run: |
          python nba_halftime_alerts.py --report || true
          git config user.name "nba-alert-bot"
          git config user.email "nba-alert-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "Alert log $(date -u +%F)" && git pull --rebase && git push)
